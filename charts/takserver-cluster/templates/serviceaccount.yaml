{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  # Shared by all TAK Server pods and the Ignite StatefulSet - Kubernetes
  # discovery requires endpoints/pods read in the release namespace.
  name: {{ include "takserver-cluster.serviceAccountName" . }}
  labels:
    {{- include "takserver-cluster.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
