{{- if and .Values.rbac.create (not .Values.certs.existingSecret) }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "takserver-cluster.certgenServiceAccountName" . }}
  labels:
    {{- include "takserver-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: certgen
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "takserver-cluster.certgenServiceAccountName" . }}
  labels:
    {{- include "takserver-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: certgen
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "takserver-cluster.certgenServiceAccountName" . }}
  labels:
    {{- include "takserver-cluster.labels" . | nindent 4 }}
    app.kubernetes.io/component: certgen
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "takserver-cluster.certgenServiceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "takserver-cluster.certgenServiceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
