apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "takserver-cluster.fullname" . }}-config
  labels:
    {{- include "takserver-cluster.componentLabels" (dict "context" $ "component" "config") | nindent 4 }}
spec:
  # The config microservice holds centralized configuration - run exactly one.
  replicas: {{ .Values.config.replicas }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "takserver-cluster.componentSelectorLabels" (dict "context" $ "component" "config") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "takserver-cluster.componentSelectorLabels" (dict "context" $ "component" "config") | nindent 8 }}
      {{- with .Values.config.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "takserver-cluster.serviceAccountName" . }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        - name: wait-for-deps
          image: {{ include "takserver-cluster.image" (dict "image" .Values.image "global" .Values.global "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: POSTGRES_HOST
              value: {{ include "takserver-cluster.dbHost" . | quote }}
            - name: POSTGRES_PORT
              value: {{ include "takserver-cluster.dbPort" . | quote }}
          command:
            - sh
            - -ec
            - |
              echo "waiting for postgres at ${POSTGRES_HOST}:${POSTGRES_PORT}..."
              until nc -zw3 "$POSTGRES_HOST" "$POSTGRES_PORT"; do sleep 2; done
              {{- if .Values.ignite.enabled }}
              echo "waiting for ignite discovery on takserver-ignite:47500..."
              until nc -zw3 takserver-ignite 47500; do sleep 2; done
              {{- end }}
      containers:
        - name: takserver-config
          image: {{ include "takserver-cluster.image" (dict "image" .Values.image "global" .Values.global "appVersion" .Chart.AppVersion) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - config
          env:
            {{- include "takserver-cluster.dbEnv" . | nindent 12 }}
            - name: MAX_HEAP_PERCENT
              value: {{ .Values.heap.maxHeapPercent | default 90 | quote }}
            {{- with .Values.config.maxHeapMb }}
            - name: CONFIG_MAX_HEAP_MB
              value: {{ . | quote }}
            {{- end }}
            {{- range $name, $value := .Values.env }}
            - name: {{ $name }}
              value: {{ $value | quote }}
            {{- end }}
          readinessProbe:
            exec:
              command:
                - /opt/tak/scripts/readiness-config.sh
            initialDelaySeconds: 15
            periodSeconds: 10
            failureThreshold: 36
          livenessProbe:
            exec:
              command:
                - /opt/tak/scripts/readiness-config.sh
            initialDelaySeconds: 180
            periodSeconds: 30
            failureThreshold: 6
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.config.resources | nindent 12 }}
          volumeMounts:
            {{- include "takserver-cluster.volumeMounts" . | nindent 12 }}
      volumes:
        {{- include "takserver-cluster.volumes" . | nindent 8 }}
      {{- include "takserver-cluster.imagePullSecrets" (dict "context" $ "image" .Values.image) | nindent 6 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
