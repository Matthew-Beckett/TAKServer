{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "takserver-cluster.serviceAccountName" . }}
  labels:
    {{- include "takserver-cluster.labels" . | nindent 4 }}
rules:
  # Required by the Ignite Kubernetes IP finder used by both the Ignite
  # server nodes and the TAK Server client nodes (config/messaging/api).
  - apiGroups: [""]
    resources: ["pods", "endpoints"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "takserver-cluster.serviceAccountName" . }}
  labels:
    {{- include "takserver-cluster.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "takserver-cluster.serviceAccountName" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "takserver-cluster.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
